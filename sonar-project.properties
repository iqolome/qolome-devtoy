# 等待门禁结果
sonar.qualitygate.wait=true
# 定义唯一的关键字
sonar.projectKey=app:qolome-devtoy
# 定义项目名称
sonar.projectName=qolome-devtoy

# 版本号（与 Qolome.Devtoy.App.csproj Version 对齐）
sonar.projectVersion=1.0.0

# 执行项目编码
sonar.sourceEncoding=UTF-8
# 版本管理方式
sonar.scm.provider=git

# 源码（.NET / WinUI）；构建产物、脚本、文档与生成代码排除
sonar.sources=src
sonar.exclusions=**/bin/**,**/obj/**,**/dist/**,**/*.g.cs,**/*.g.i.cs,**/Generated Files/**,**/scripts/**,**/docs/**
# WinUI / 代码生成工具暂无单元测试与覆盖率报告；门禁 new_coverage 依赖「可覆盖行」为空或后续补测
sonar.coverage.exclusions=**/*
sonar.python.version=3.11
